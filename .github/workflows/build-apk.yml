name: Build Android APK (DDevUltraHome)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Dependencies
        run: pnpm install

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Initialize & Build TWA WebAPK
        run: |
          mkdir -p apk-output
          echo "Building DDevUltraHome APK from PWA Manifest..."
          # Generates and builds Android APK using Bubblewrap
          bubblewrap init --manifest=public/manifest.json --directory=android-twa || true
          if [ -d "android-twa" ]; then
            cd android-twa
            bubblewrap build || true
            cp -r *.apk ../apk-output/ || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DDevUltraHome-Android-APK
          path: apk-output/*.apk
          if-no-files-found: ignore
